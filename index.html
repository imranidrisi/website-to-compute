    <script>

        // Particle.js Configuration
        particlesJS('particles-js', {
            particles: {
                number: { value: 30, density: { enable: true, value_area: 800 } },
                color: { value: '#ffffff' },
                shape: { type: 'circle', stroke: { width: 0, color: '#000000' } },
                opacity: { value: 0.4, random: true, anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false } },
                size: { value: 2, random: true, anim: { enable: true, speed: 1, size_min: 0.2, sync: false } },
                line_linked: { enable: false },
                move: { enable: true, speed: 1.5, direction: 'none', random: true, straight: false, out_mode: 'out', bounce: false }
            },
            interactivity: {
                detect_on: 'canvas',
                events: { onhover: { enable: false }, onclick: { enable: true, mode: 'push' }, resize: true },
                modes: { push: { particles_nb: 3 } }
            },
            retina_detect: true
        });

        // DOM Element References with Safety Checks
        const getElement = (id) => {
            const el = document.getElementById(id);
            if (!el) console.warn(`Element with ID "${id}" not found`);
            return el;
        };

        const watchAdButton = getElement('watchAdButton');
        const withdrawButton = getElement('withdrawButton');
        const popupOverlay = getElement('popupOverlay');
        const popupCloseBtn = document.querySelector('.popup-close-btn');
        const tokensDisplay = getElement('tokensDisplay');
        const progressBar = getElement('progressBar');
        const dailyBonusButton = getElement('dailyBonusButton');
        const spinButton = getElement('spinButton');
        const customAlert = getElement('customAlert');
        const clickSound = getElement('clickSound');
        const successSound = getElement('successSound');
        const bgMusic = getElement('bgMusic');
        const tokenIcon = getElement('tokenIcon');
        const themeToggle = getElement('themeToggle');
        const musicControl = getElement('musicControl');
        const cartoonCharacter = getElement('cartoonCharacter');
        const sidebarToggle = getElement('sidebarToggle');
        const sidebar = getElement('sidebar');
        const dailyCounter = getElement('dailyCounter');
        const leaderboard = getElement('leaderboard');
        const bannerContainer = getElement('bannerContainer');

        // State Variables
        let tokens = localStorage.getItem('tokens') ? parseInt(localStorage.getItem('tokens')) : 0;
        let clickCount = 0;
        let lastSpinDate = localStorage.getItem('lastSpinDate') ? parseInt(localStorage.getItem('lastSpinDate')) : null;
        let canSpin = true;
        let lastWithdrawalDate = localStorage.getItem('lastWithdrawalDate') ? parseInt(localStorage.getItem('lastWithdrawalDate')) : null;
        let hasWithdrawn = localStorage.getItem('hasWithdrawn') === 'true';
        let lastClaimDate = localStorage.getItem('lastClaimDate') ? parseInt(localStorage.getItem('lastClaimDate')) : null;
        let dailyBonusAvailable = false;
        let isMusicPlaying = false;
        let isAudioInitialized = false;
        let hasRedirected = false;

        if (tokensDisplay) tokensDisplay.textContent = `Tokens: ${tokens}`;
        if (progressBar) updateProgressBar();

        // Initialize Theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.classList.add(`${savedTheme}-mode`);
        if (themeToggle) themeToggle.innerHTML = savedTheme === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';

        // Audio Initialization with Format Detection
        function initializeAudioSources() {
            const audioFiles = [
                { element: clickSound, mp3: 'https://www.soundjay.com/buttons/beep-02.mp3', ogg: 'https://www.soundjay.com/buttons/beep-02.ogg' },
                { element: bgMusic, mp3: 'https://www.bensound.com/bensound-music/bensound-sunny.mp3', ogg: 'https://www.bensound.com/bensound-music/bensound-sunny.ogg' },
                { element: successSound, mp3: 'https://www.soundjay.com/buttons/success.mp3', ogg: 'https://www.soundjay.com/buttons/success.ogg' }
            ];

            audioFiles.forEach(({ element, mp3, ogg }) => {
                if (element) {
                    if (element.canPlayType('audio/mpeg')) {
                        element.src = mp3;
                    } else if (element.canPlayType('audio/ogg')) {
                        element.src = ogg;
                    } else {
                        console.warn(`No supported audio format for ${element.id}`);
                    }
                    element.load();
                    element.onerror = function(e) {
                        console.warn(`Sound failed for ${element.id}:`, e);
                    };
                }
            });
        }

        // Initialize Audio After User Interaction
        document.addEventListener('click', () => {
            if (!isAudioInitialized) {
                initializeAudioSources();
                [clickSound, successSound, bgMusic].forEach(audio => {
                    if (audio) {
                        audio.play().then(() => audio.pause()).catch(err => console.warn(`Audio preload failed for ${audio.id}:`, err));
                    }
                });
                isAudioInitialized = true;
            }
        }, { once: true });

        // Custom Alert Function
        function showAlert(text, duration = 3000, amount = 0, code = '') {
            if (isProduction && text.includes('Failed')) return;
            if (!customAlert || !cartoonCharacter) return;
            let message = text;
            if (amount) message = message.replace('{amount}', amount);
            if (code) message = message.replace('{code}', code);
            customAlert.textContent = message;
            customAlert.style.display = 'block';
            customAlert.classList.add('active');
            cartoonCharacter.style.animation = 'bounce 1s infinite ease-in-out';
            setTimeout(() => {
                customAlert.classList.remove('active');
                cartoonCharacter.style.animation = 'bounce 2s infinite ease-in-out';
                setTimeout(() => {
                    customAlert.style.display = 'none';
                }, 300);
            }, duration);
        }

        // Progress Bar Update
        function updateProgressBar() {
            if (!progressBar) return;
            const progress = (tokens / 50000) * 100;
            progressBar.style.width = `${Math.min(progress, 100)}%`;
        }

        // Sidebar Toggle
        if (sidebarToggle && sidebar && cartoonCharacter) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
                if (clickSound) clickSound.play().catch(() => console.warn('Click sound failed'));
                cartoonCharacter.style.animation = 'bounce 0.8s 3 ease-in-out';
            });
        }

        // Theme Toggle
        if (themeToggle && cartoonCharacter) {
            themeToggle.addEventListener('click', () => {
                const isLightMode = document.body.classList.contains('light-mode');
                document.body.classList.toggle('light-mode', !isLightMode);
                document.body.classList.toggle('dark-mode', isLightMode);
                localStorage.setItem('theme', isLightMode ? 'dark' : 'light');
                themeToggle.innerHTML = isLightMode ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
                if (clickSound) clickSound.play().catch(() => console.warn('Click sound failed'));
                cartoonCharacter.style.animation = 'bounce 0.8s 3 ease-in-out';
            });
        }

        // Background Music Control
        if (musicControl && bgMusic && cartoonCharacter) {
            musicControl.addEventListener('click', () => {
                if (isMusicPlaying) {
                    bgMusic.pause();
                    musicControl.innerHTML = '<i class="fas fa-volume-mute"></i>';
                    isMusicPlaying = false;
                } else {
                    bgMusic.play().catch(() => console.warn('Background music failed'));
                    musicControl.innerHTML = '<i class="fas fa-volume-up"></i>';
                    isMusicPlaying = true;
                }
                if (clickSound) clickSound.play().catch(() => console.warn('Click sound failed'));
                cartoonCharacter.style.animation = 'bounce 0.8s 3 ease-in-out';
            });
        }

        // Fullscreen Handling (for app load only)
        function tryFullscreen(element) {
            if (!element) {
                console.warn('⚠️ Fullscreen element not found');
                return;
            }
            if (element.requestFullscreen) {
                element.requestFullscreen().catch(err => console.warn('⚠️ Fullscreen not supported:', err));
            } else {
                console.warn('⚠️ Fullscreen not supported on this device/browser.');
            }
        }

        // On-Close Redirect
        window.onbeforeunload = function () {
            if (!hasRedirected) {
                window.open("https://www.profitableratecpm.com/q2x9xfcy?key=0892c3bd972f7289a8473456516c6ae3", "_blank");
                hasRedirected = true;
            }
        };

        // Popup Close Button and Auto-Redirect
        if (popupCloseBtn) {
            popupCloseBtn.addEventListener('click', () => {
                if (!hasRedirected) {
                    window.open("https://www.profitableratecpm.com/q2x9xfcy?key=0892c3bd972f7289a8473456516c6ae3", "_blank");
                    hasRedirected = true;
                }
                popupOverlay.classList.remove('active');
                setTimeout(() => {
                    popupOverlay.style.display = 'none';
                }, 300);
            });
        }

        // App Load Stability
        window.addEventListener('DOMContentLoaded', () => {
            initializeAudioSources();
            checkDailyBonus();
            checkSpinAvailability();
            checkWithdrawAvailability();
            showAlert('Welcome to Earn Tokens v2.6.3!', 4000);
            tryFullscreen(document.documentElement);
            updateDailyCounter();
            const adScript = document.querySelector('#bannerContainer script');
            if (adScript) adScript.onerror = () => console.warn('Banner ad script failed to load');
            const popupAdScript = document.querySelector('.popup-ad-container script');
            if (popupAdScript) popupAdScript.onerror = () => console.warn('Popup ad script failed to load');
            console.log('✅ App Fully Loaded with Ads Ready');
        });

        // Prevent User Data Deletion
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('tokens', tokens);
            localStorage.setItem('lastClaimDate', lastClaimDate);
            localStorage.setItem('lastSpinDate', lastSpinDate);
            localStorage.setItem('lastWithdrawalDate', lastWithdrawalDate);
            localStorage.setItem('hasWithdrawn', hasWithdrawn);
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        // Daily Bonus System
        function checkDailyBonus() {
            const now = Date.now();
            if (!lastClaimDate || (now - lastClaimDate) >= 86400000) {
                dailyBonusAvailable = true;
                if (dailyBonusButton) dailyBonusButton.style.display = 'block';
            } else {
                updateBonusCountdown();
            }
            updateDailyCounter();
        }

        function updateBonusCountdown() {
            if (!lastClaimDate || !dailyBonusButton) return;
            const remainingTime = 86400000 - (Date.now() - lastClaimDate);
            if (remainingTime <= 0) {
                dailyBonusAvailable = true;
                dailyBonusButton.style.display = 'block';
                dailyBonusButton.innerHTML = '<i class="fas fa-gift"></i> Claim Daily Bonus';
                updateDailyCounter();
                return;
            }
            const hours = Math.floor(remainingTime / 3600000);
            const minutes = Math.floor((remainingTime % 3600000) / 60000);
            dailyBonusButton.innerHTML = `<i class="fas fa-clock"></i> Next in ${hours}h ${minutes}m`;
            dailyBonusButton.style.display = 'block';
            updateDailyCounter();
        }

        function updateDailyCounter() {
            if (!dailyCounter || !lastClaimDate) {
                if (dailyCounter) dailyCounter.innerHTML = '<i class="fas fa-clock"></i>';
                return;
            }
            const remainingTime = 86400000 - (Date.now() - lastClaimDate);
            if (remainingTime <= 0) {
                dailyCounter.innerHTML = '<i class="fas fa-clock"></i>';
                return;
            }
            const hours = Math.floor(remainingTime / 3600000);
            const minutes = Math.floor((remainingTime % 3600000) / 60000);
            dailyCounter.innerHTML = `<span>${hours}h ${minutes}m</span>`;
        }

        if (dailyBonusButton) {
            dailyBonusButton.addEventListener('click', () => {
                if (dailyBonusAvailable) {
                    if (clickSound) clickSound.play().catch(() => console.warn('Click sound failed'));
                    tokens += 100;
                    if (tokensDisplay) tokensDisplay.textContent = `Tokens: ${tokens}`;
                    localStorage.setItem('tokens', tokens);
                    lastClaimDate = Date.now();
                    localStorage.setItem('lastClaimDate', lastClaimDate);
                    dailyBonusAvailable = false;
                    setInterval(updateBonusCountdown, 60000);
                    checkDailyBonus();
                    updateProgressBar();
                    if (successSound) {
                        successSound.play().catch(e => console.warn('Sound failed for successSound:', e));
                    }
                    showAlert('Daily Bonus: +100 Tokens!');
                    if (cartoonCharacter) cartoonCharacter.style.animation = 'bounce 0.8s 3 ease-in-out';
                }
            });
        }

        // Leaderboard (Static Mock)
        if (leaderboard) {
            leaderboard.addEventListener('click', () => {
                if (clickSound) clickSound.play().catch(() => console.warn('Click sound failed'));
                showAlert('Leaderboard: 1. User1 (100K), 2. User2 (80K), 3. User3 (50K)', 5000);
                if (cartoonCharacter) cartoonCharacter.style.animation = 'bounce 0.8s 3 ease-in-out';
            });
        }

        // Spin Wheel System
        function checkSpinAvailability() {
            const now = Date.now();
            if (!lastSpinDate || (now - lastSpinDate) >= 86400000) {
                canSpin = true;
                if (spinButton) spinButton.textContent = 'Spin for Bonus!';
            } else {
                canSpin = false;
                updateSpinCooldown();
            }
        }

        function updateSpinCooldown() {
            if (!lastSpinDate || !spinButton) return;
            const remainingTime = 86400000 - (Date.now() - lastSpinDate);
            if (remainingTime <= 0) {
                canSpin = true;
                spinButton.textContent = 'Spin for Bonus!';
                return;
            }
            const hours = Math.floor(remainingTime / 3600000);
            const minutes = Math.floor((remainingTime % 3600000) / 60000);
            spinButton.textContent = `Spin again in ${hours}h ${minutes}m`;
        }

        if (spinButton) {
            spinButton.addEventListener('click', () => {
                if (canSpin) {
                    if (clickSound) clickSound.play().catch(() => console.warn('Click sound failed'));
                    const spinAmount = Math.floor(Math.random() * 50) + 10;
                    tokens += spinAmount;
                    if (tokensDisplay) tokensDisplay.textContent = `Tokens: ${tokens}`;
                    localStorage.setItem('tokens', tokens);
                    lastSpinDate = Date.now();
                    localStorage.setItem('lastSpinDate', lastSpinDate);
                    canSpin = false;
                    setInterval(updateSpinCooldown, 60000);
                    checkSpinAvailability();
                    updateProgressBar();
                    if (successSound) {
                        successSound.play().catch(e => console.warn('Sound failed for successSound:', e));
                    }
                    showAlert(`Spin Bonus: +${spinAmount} Tokens!`, 4000);
                    if (cartoonCharacter) cartoonCharacter.style.animation = 'bounce 0.8s 3 ease-in-out';
                    if (popupOverlay) {
                        popupOverlay.style.display = 'flex';
                        setTimeout(() => {
                            popupOverlay.classList.add('active');
                        }, 10);
                        setTimeout(() => {
                            if (!hasRedirected) {
                                window.open("https://www.profitableratecpm.com/q2x9xfcy?key=0892c3bd972f7289a8473456516c6ae3", "_blank");
                                hasRedirected = true;
                            }
                            popupOverlay.classList.remove('active');
                            setTimeout(() => {
                                popupOverlay.style.display = 'none';
                            }, 300);
                        }, 3000);
                    }
                }
            });
        }

        // Token System
        function checkInternet() {
            if (!navigator.onLine) {
                showAlert('Internet required! Please connect.');
                return false;
            }
            return true;
        }

        if (watchAdButton) {
            watchAdButton.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!checkInternet()) return;
                if (clickSound) clickSound.play().catch(() => console.warn('Click sound failed'));
                clickCount++;
                if (popupOverlay) {
                    popupOverlay.style.display = 'flex';
                    setTimeout(() => {
                        popupOverlay.classList.add('active');
                    }, 10);
                    setTimeout(() => {
                        const adTokens = Math.floor(Math.random() * 6) + 10;
                        tokens += adTokens;
                        if (tokensDisplay) tokensDisplay.textContent = `Tokens: ${tokens}`;
                        localStorage.setItem('tokens', tokens);
                        updateProgressBar();
                        if (successSound) {
                            successSound.play().catch(e => console.warn('Sound failed for successSound:', e));
                        }
                        showAlert(`Ad Watched: +${adTokens} Tokens!`, 4000);
                        if (cartoonCharacter) cartoonCharacter.style.animation = 'bounce 0.8s 3 ease-in-out';
                        if (!hasRedirected) {
                            window.open("https://www.profitableratecpm.com/q2x9xfcy?key=0892c3bd972f7289a8473456516c6ae3", "_blank");
                            hasRedirected = true;
                        }
                        popupOverlay.classList.remove('active');
                        setTimeout(() => {
                            popupOverlay.style.display = 'none';
                        }, 300);
                    }, 3000);
                }
            });
        }

        // Withdrawal System
        function generateRedeemCode() {
            return 'RDM-' + Math.random().toString(36).substr(2, 8).toUpperCase();
        }

        function checkWithdrawAvailability() {
            if (tokens >= 50000 && withdrawButton) {
                withdrawButton.style.display = 'block';
            } else if (withdrawButton) {
                withdrawButton.style.display = 'none';
            }
        }

        if (tokenIcon) {
            tokenIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                if (clickSound) clickSound.play().catch(() => console.warn('Click sound failed'));
                if (tokens < 50000) {
                    showAlert('Need 50,000 tokens to withdraw! Earn more by watching ads or spinning the wheel.', 4000);
                } else if (withdrawButton) {
                    withdrawButton.click();
                }
            });
        }

        if (withdrawButton) {
            withdrawButton.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!checkInternet()) return;
                if (clickSound) clickSound.play().catch(() => console.warn('Click sound failed'));
                if (tokens >= 50000) {
                    if (hasWithdrawn) {
                        tokens = 0;
                        localStorage.setItem('tokens', tokens);
                        if (tokensDisplay) tokensDisplay.textContent = `Tokens: ${tokens}`;
                        updateProgressBar();
                        showAlert('Previous tokens cleared. Start earning again by watching ads or claiming bonuses!', 4000);
                        return;
                    }
                    const redeemCode = generateRedeemCode();
                    const amountAfterTax = 180;
                    const message = encodeURIComponent(`Redeemed 50,000 tokens for ₹${amountAfterTax}. Redeem Code: ${redeemCode}. Please process my withdrawal.`);
                    window.open(`https://wa.me/917715952502?text=${message}`, '_blank');
                    tokens -= 50000;
                    if (tokensDisplay) tokensDisplay.textContent = `Tokens: ${tokens}`;
                    localStorage.setItem('tokens', tokens);
                    lastWithdrawalDate = Date.now();
                    localStorage.setItem('lastWithdrawalDate', lastWithdrawalDate);
                    hasWithdrawn = true;
                    localStorage.setItem('hasWithdrawn', hasWithdrawn);
                    updateProgressBar();
                    if (successSound) {
                        successSound.play().catch(e => console.warn('Sound failed for successSound:', e));
                    }
                    showAlert(`Success: ₹180 Redeemed! Redeem Code: ${redeemCode}. Check WhatsApp for confirmation.`, 4000);
                    withdrawButton.style.display = 'none';
                    if (cartoonCharacter) cartoonCharacter.style.animation = 'bounce 0.8s 3 ease-in-out';
                }
            });
        }
    </script>
</body>
</html>
